<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products · Example shop</title>
    <style>
      body { margin: 40px; font-family: system-ui, sans-serif; line-height: 1.5; color: #1b2430; }
      nav a { margin-right: 16px; }
      button { margin-right: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
      header { display: flex; justify-content: space-between; align-items: center; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/products/">Products</a>
        <a href="/checkout/">Checkout</a>
      </nav>
      <button id="account" type="button">Sign in as user 42</button>
    </header>
    <p id="status">Loading…</p>
    <h1>Products</h1>
    <ul>
      <li><a href="/products/blue-shoes" data-product="blue-shoes">Blue shoes</a></li>
      <li><a href="/products/red-boots" data-product="red-boots">Red boots</a></li>
    </ul>
    <p id="product"></p>
    <script type="module" src="/src/shop.js"></script>
  </body>
</html>
