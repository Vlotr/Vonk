# Tests on every push and pull request, with the same make targets as on a
# developer's machine (see CLAUDE.md), and the image for amd64 and arm64.
# The image is pushed to the GitHub Container Registry for a version tag
# (v1.2.3) and for every push to main (a merge), with GITHUB_TOKEN; no other
# secrets are used. Actions are
# pinned to a commit, with their version as a comment; checkouts keep no
# credentials.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a branch makes its running checks moot; a release keeps going.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Go vet and race tests, web typecheck, Vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make test
        run: make test
      - name: make build (the web build and the binary with it)
        run: make build

  postgres:
    name: Go tests against Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: make test-postgres
        run: make test-postgres

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
            examples/browser/package-lock.json
            examples/posthog/package-lock.json
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer
      - name: Chromium's system libraries
        run: cd e2e && npm ci && npx playwright install-deps chromium
      - name: make e2e
        run: make e2e
      - name: Keep the screenshots and process logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/screenshots/
            e2e/.logs/
            e2e/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  image:
    name: Image for linux/amd64 and linux/arm64 (build only)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}
    needs: [test, postgres, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make docker-multiarch
        run: make docker-multiarch IMAGE_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

  release:
    name: Image for linux/amd64 and linux/arm64, pushed to GHCR
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test, postgres, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job, and only for a version tag or main, may write packages.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monitor"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # A merge to main moves main and adds sha-<commit>; release tags stay as they are.
            version="main-${GITHUB_SHA::7}"
            echo "tags=$image:main $image:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          tags="$image:$version"
          # A release (1.2.3) also moves 1.2, 1 and latest; a pre-release (1.3.0-rc.1) only gets its own tag.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags="$tags $image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]} $image:${BASH_REMATCH[1]} $image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: make docker-multiarch (build and push)
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE_VERSION: ${{ steps.tags.outputs.version }}
        run: >-
          make docker-multiarch VERSION="$IMAGE_VERSION" IMAGE_TAGS="$IMAGE_TAGS"
          IMAGE_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
