# Tests on every push and pull request, with the same make targets as on a
# developer's machine (see CLAUDE.md), and the image for amd64 and arm64.
# The image is pushed to the GitHub Container Registry only for a version
# tag (v1.2.3), with GITHUB_TOKEN; no other secrets are used.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a branch makes its running checks moot; a release keeps going.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Go vet and race tests, web typecheck, Vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make test
        run: make test
      - name: make build (the web build and the binary with it)
        run: make build

  postgres:
    name: Go tests against Postgres 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make test-postgres
        run: make test-postgres

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
            examples/browser/package-lock.json
            examples/posthog/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - name: Chromium's system libraries
        run: cd e2e && npm ci && npx playwright install-deps chromium
      - name: make e2e
        run: make e2e
      - name: Keep the screenshots and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/screenshots/
            e2e/.logs/
            e2e/test-results/
          include-hidden-files: true
          if-no-files-found: ignore

  image:
    name: Image for linux/amd64 and linux/arm64
    needs: [test, postgres, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: make docker-multiarch (build only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: make docker-multiarch
      - name: Image tags
        if: startsWith(github.ref, 'refs/tags/v')
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monitor"
          tags="$image:$version"
          # A release (1.2.3) also moves 1.2, 1 and latest; a pre-release (1.3.0-rc.1) only gets its own tag.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags="$tags $image:${BASH_REMATCH[1]}.${BASH_REMATCH[2]} $image:${BASH_REMATCH[1]} $image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: make docker-multiarch (build and push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: make docker-multiarch VERSION="$GITHUB_REF_NAME" IMAGE_TAGS="$IMAGE_TAGS"
